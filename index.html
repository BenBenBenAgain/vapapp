<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VAPAPP — breath check-in prototype</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ink: #eef1f0;
    --dim: #7f8b89;
    --bg-0: #0a0f0e;
    --bg-1: #0f1614;
    --vapor: #9fe8d8;
    --vapor-dim: #4d7a70;
    --ember: #ff8a5c;
    --line: rgba(159,232,216,0.14);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; height:100%;
    background: radial-gradient(120% 90% at 50% 0%, var(--bg-1), var(--bg-0) 70%);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    overscroll-behavior: none;
    user-select: none;
  }

  .screen{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 20px 34px;
    position:relative;
    overflow:hidden;
  }

  /* ambient drifting vapor lines */
  .drift{
    position:absolute; inset:0; pointer-events:none; opacity:0.5;
  }
  .drift span{
    position:absolute;
    width:1px;
    background: linear-gradient(to top, transparent, var(--line), transparent);
    animation: rise linear infinite;
  }
  @keyframes rise{
    from{ transform: translateY(10%) scaleY(0.8); opacity:0; }
    15%{ opacity:1; }
    85%{ opacity:1; }
    to{ transform: translateY(-110%) scaleY(1.2); opacity:0; }
  }

  header{
    width:100%; max-width:420px;
    display:flex; justify-content:space-between; align-items:baseline;
    z-index:2;
  }
  .wordmark{
    font-weight:700; letter-spacing:0.02em; font-size:15px;
  }
  .wordmark em{ font-style:normal; color:var(--vapor); }
  .sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; color:var(--dim); letter-spacing:0.08em; text-transform:uppercase;
  }

  .stage{
    flex:1;
    width:100%; max-width:420px;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    gap:10px;
    z-index:2;
    position:relative;
  }

  .count-wrap{
    text-align:center;
  }
  .count{
    font-size:64px; font-weight:700; line-height:1;
    letter-spacing:-0.02em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 40px rgba(159,232,216,0.25);
    transition: transform 0.15s ease;
  }
  .count.pulse{ transform: scale(1.12); }
  .count-label{
    margin-top:4px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--dim);
  }

  /* ===== the device — fills most of the screen, mouthpiece at bottom ===== */
  .device-zone{
    position:relative;
    flex:1;
    width:100%;
    display:flex; align-items:center; justify-content:center;
    min-height:0;
  }
  .device-svg{
    height:100%;
    max-height:56vh;
    width:auto;
    filter: drop-shadow(0 20px 40px rgba(0,0,0,0.5));
    transition: transform 0.18s ease;
  }

  /* meter now wraps the device as a vertical fill on the side */
  .side-meter{
    position:absolute;
    right:8%;
    top:14%;
    bottom:22%;
    width:5px;
    border-radius:3px;
    background: rgba(255,255,255,0.06);
    overflow:hidden;
    display:flex; align-items:flex-end;
  }
  .side-meter-fill{
    width:100%; height:0%;
    background: linear-gradient(to top, var(--vapor-dim), var(--vapor));
    transition: height 0.05s linear;
  }

  .status{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; letter-spacing:0.06em; color:var(--dim);
    min-height:16px;
    text-align:center;
    transition: color 0.2s ease;
  }
  .status.live{ color: var(--vapor); }
  .status.hit{ color: var(--ember); }

  footer{
    width:100%; max-width:420px;
    z-index:2;
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }

  .mic-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    background: transparent;
    color: var(--vapor);
    border: 1px solid var(--vapor-dim);
    border-radius:100px;
    padding:13px 26px;
    cursor:pointer;
  }
  .mic-btn:active{ transform: scale(0.97); }
  .mic-btn[disabled]{ opacity:0.4; }

  .hint{
    font-size:11px; color:var(--dim); text-align:center; max-width:280px; line-height:1.5;
  }

  .toast{
    position:fixed; left:50%; top:14%;
    transform: translate(-50%, -12px);
    background: rgba(15,22,20,0.9);
    border:1px solid var(--vapor-dim);
    color: var(--ember);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    padding:9px 16px; border-radius:8px;
    opacity:0; pointer-events:none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index:5;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform: translate(-50%, 0); }

  /* vapor puffs released after an inhale ends */
  .vapor-layer{
    position:absolute;
    left:50%; bottom:8%;
    width:1px; height:1px;
    pointer-events:none;
    z-index:3;
  }
  .puff{
    position:absolute;
    left:0; top:0;
    width: var(--sz, 60px);
    height: var(--sz, 60px);
    margin-left: calc(var(--sz, 60px) / -2);
    margin-top: calc(var(--sz, 60px) / -2);
    border-radius:50%;
    background: radial-gradient(circle, rgba(200,235,228,0.55), rgba(200,235,228,0) 70%);
    filter: blur(2px);
    opacity:0;
    animation: puff-rise var(--dur, 1.6s) ease-out forwards;
  }
  @keyframes puff-rise{
    0%{ opacity:0; transform: translate(0,0) scale(0.3); }
    12%{ opacity:0.85; }
    100%{
      opacity:0;
      transform: translate(var(--dx, 0px), var(--dy, -160px)) scale(var(--grow, 2.2));
    }
  }
</style>
</head>
<body>

<div class="screen">
  <div class="drift" id="drift"></div>

  <header>
    <div class="wordmark">VAP<em>APP</em></div>
    <div class="sub">v0.1 breath check-in</div>
  </header>

  <div class="stage">
    <div class="count-wrap">
      <div class="count" id="count">0</div>
      <div class="count-label" id="countLabel">clouds beaten</div>
    </div>

    <div class="device-zone">
      <div class="side-meter"><div class="side-meter-fill" id="meterFill"></div></div>

      <svg class="device-svg" id="device" viewBox="0 0 200 620" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#1b2724"/>
            <stop offset="18%" stop-color="#233530"/>
            <stop offset="50%" stop-color="#0d1513"/>
            <stop offset="82%" stop-color="#233530"/>
            <stop offset="100%" stop-color="#1b2724"/>
          </linearGradient>
          <linearGradient id="tipGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0a0f0e"/>
            <stop offset="100%" stop-color="#000000"/>
          </linearGradient>
          <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#9fe8d8" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#9fe8d8" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="windowGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0a1211"/>
            <stop offset="100%" stop-color="#050908"/>
          </linearGradient>
        </defs>

        <!-- ambient hit glow, hidden by default -->
        <circle id="hitGlow" cx="100" cy="560" r="10" fill="url(#glowGrad)" opacity="0"/>

        <!-- main body -->
        <rect x="42" y="70" width="116" height="460" rx="26" fill="url(#bodyGrad)" stroke="rgba(159,232,216,0.18)" stroke-width="1.5"/>

        <!-- juice window -->
        <rect x="64" y="240" width="72" height="190" rx="10" fill="url(#windowGrad)" stroke="rgba(159,232,216,0.14)" stroke-width="1"/>
        <rect id="juiceLevel" x="68" y="320" width="64" height="106" rx="7" fill="#3f6a60" opacity="0.55"/>

        <!-- brand strip -->
        <text x="100" y="130" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="2" fill="#9fe8d8" opacity="0.55">VAPAPP</text>
        <line x1="64" y1="150" x2="136" y2="150" stroke="rgba(159,232,216,0.18)" stroke-width="1"/>

        <!-- LED status dot -->
        <circle id="ledDot" cx="100" cy="180" r="6" fill="#4d7a70"/>

        <!-- lower band -->
        <rect x="42" y="460" width="116" height="70" fill="rgba(0,0,0,0.18)"/>

        <!-- neck -->
        <path d="M70 530 L130 530 L120 556 L80 556 Z" fill="url(#bodyGrad)" stroke="rgba(159,232,216,0.18)" stroke-width="1.5"/>

        <!-- mouthpiece / tip -->
        <path id="tip" d="M80 556 L120 556 L112 596 Q100 606 88 596 Z" fill="url(#tipGrad)" stroke="rgba(159,232,216,0.25)" stroke-width="1.5"/>

        <!-- outer highlight -->
        <rect x="46" y="74" width="10" height="452" rx="5" fill="#ffffff" opacity="0.03"/>
      </svg>
      <div class="vapor-layer" id="vaporLayer"></div>
    </div>

    <div class="status" id="status">tap start, allow the mic</div>
  </div>

  <footer>
    <button class="mic-btn" id="micBtn">Start</button>
    <div class="hint">Hold your phone like normal. When a craving hits, breathe in near the mic like you're taking a drag — a firm, held inhale, about a second long.</div>
  </footer>
</div>

<div class="toast" id="toast">hit logged</div>

<script>
const $ = id => document.getElementById(id);
const status = $('status'), countEl = $('count'), meterFill = $('meterFill');
const micBtn = $('micBtn'), toast = $('toast'), countLabel = $('countLabel');
const device = $('device'), hitGlow = $('hitGlow'), ledDot = $('ledDot'), tip = $('tip'), vaporLayer = $('vaporLayer');

let count = 0;
let audioCtx, analyser, source, dataArray, rafId;
let listening = false;

// inhale-detection state machine
// we look for: quiet -> rising energy sustained above threshold for a min duration -> falling back to quiet
const RMS_ON = 0.05;      // energy level considered "breath starting"
const RMS_OFF = 0.025;    // energy level considered "breath ended"
const MIN_HOLD_MS = 380;  // minimum sustained duration to count as a real inhale (filters taps/pops)
const MAX_HOLD_MS = 2500; // cap so it doesn't count you talking for 10s
const COOLDOWN_MS = 900;  // avoid double counting one breath

let breathStart = null;
let lastHitAt = 0;
let smoothed = 0;

function makeDrift(){
  const wrap = $('drift');
  const n = 14;
  for(let i=0;i<n;i++){
    const s = document.createElement('span');
    const left = Math.random()*100;
    const height = 40 + Math.random()*90;
    const dur = 7 + Math.random()*9;
    const delay = -Math.random()*dur;
    s.style.left = left+'%';
    s.style.height = height+'px';
    s.style.bottom = '-10%';
    s.style.animationDuration = dur+'s';
    s.style.animationDelay = delay+'s';
    wrap.appendChild(s);
  }
}
makeDrift();

function setStatus(text, mode){
  status.textContent = text;
  status.className = 'status' + (mode ? ' '+mode : '');
}

function showToast(text){
  toast.textContent = text;
  toast.classList.add('show');
  setTimeout(()=> toast.classList.remove('show'), 900);
}

function spawnVapor(){
  const n = 6 + Math.floor(Math.random()*3);
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className = 'puff';
    const dx = (Math.random()-0.5)*160;
    const dy = -(120 + Math.random()*100);
    const sz = 40 + Math.random()*50;
    const dur = 1.2 + Math.random()*0.9;
    const grow = 1.8 + Math.random()*1.6;
    const delay = Math.random()*150;
    p.style.setProperty('--dx', dx+'px');
    p.style.setProperty('--dy', dy+'px');
    p.style.setProperty('--sz', sz+'px');
    p.style.setProperty('--dur', dur+'s');
    p.style.setProperty('--grow', grow);
    p.style.animationDelay = delay+'ms';
    vaporLayer.appendChild(p);
    setTimeout(()=> p.remove(), (dur*1000)+delay+200);
  }
}

function registerHit(){
  count++;
  countEl.textContent = count;
  countEl.classList.add('pulse');
  setTimeout(()=> countEl.classList.remove('pulse'), 150);

  // tip glow flare
  hitGlow.setAttribute('opacity', '1');
  hitGlow.setAttribute('r', '4');
  let r = 4;
  const grow = setInterval(()=>{
    r += 6;
    hitGlow.setAttribute('r', r);
    hitGlow.setAttribute('opacity', Math.max(0, 1 - r/70));
    if(r > 70){ clearInterval(grow); hitGlow.setAttribute('opacity','0'); }
  }, 16);

  ledDot.setAttribute('fill', '#ff8a5c');
  setTimeout(()=> ledDot.setAttribute('fill', '#9fe8d8'), 400);

  device.style.transform = 'scale(1.015)';
  setTimeout(()=> device.style.transform = 'scale(1)', 180);

  setStatus('hit logged — craving beaten', 'hit');
  showToast(count === 1 ? 'first one down' : 'hit #'+count+' logged');
  if(navigator.vibrate) navigator.vibrate([30, 40, 60]);
  setTimeout(()=>{ if(listening) setStatus('listening…', 'live'); }, 1400);
}

async function start(){
  try{
    micBtn.disabled = true;
    setStatus('requesting mic…');
    const stream = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation:false, noiseSuppression:false, autoGainControl:false
    }});
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.15;
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.fftSize);

    listening = true;
    micBtn.textContent = 'Stop';
    micBtn.disabled = false;
    countLabel.textContent = 'clouds beaten';
    setStatus('listening…', 'live');
    ledDot.setAttribute('fill', '#9fe8d8');
    tick();
  }catch(err){
    setStatus('mic blocked — check permissions');
    micBtn.disabled = false;
    console.error(err);
  }
}

function stop(){
  listening = false;
  if(rafId) cancelAnimationFrame(rafId);
  if(audioCtx) audioCtx.close();
  micBtn.textContent = 'Start';
  meterFill.style.height = '0%';
  ledDot.setAttribute('fill', '#4d7a70');
  setStatus('stopped — tap start to resume');
  breathStart = null;
}

function tick(){
  if(!listening) return;
  analyser.getByteTimeDomainData(dataArray);

  let sumSquares = 0;
  for(let i=0;i<dataArray.length;i++){
    const v = (dataArray[i]-128)/128;
    sumSquares += v*v;
  }
  const rms = Math.sqrt(sumSquares/dataArray.length);
  smoothed = smoothed*0.7 + rms*0.3;

  const pct = Math.min(100, Math.round((smoothed/0.2)*100));
  meterFill.style.height = pct+'%';

  const now = performance.now();

  if(smoothed > RMS_ON){
    if(breathStart === null) breathStart = now;
    const held = now - breathStart;
    if(held > MIN_HOLD_MS){
      tip.setAttribute('stroke', '#9fe8d8');
      tip.setAttribute('stroke-width', '2.5');
    }
  } else if(smoothed < RMS_OFF && breathStart !== null){
    const held = now - breathStart;
    if(held >= MIN_HOLD_MS && held <= MAX_HOLD_MS && (now - lastHitAt) > COOLDOWN_MS){
      lastHitAt = now;
      registerHit();
      spawnVapor();
    }
    breathStart = null;
    tip.setAttribute('stroke', 'rgba(159,232,216,0.25)');
    tip.setAttribute('stroke-width', '1.5');
  }

  rafId = requestAnimationFrame(tick);
}

micBtn.addEventListener('click', ()=>{
  if(!listening) start(); else stop();
});
</script>

</body>
</html>
